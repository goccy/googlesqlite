spec: docs/specs/googlesql/functions/json/json_query_array.md
dialect: googlesql
cases:
  - desc: extract array of objects
    sql: SELECT TO_JSON_STRING(JSON_QUERY_ARRAY(JSON '[{"a":1}, {"a":2}]'))
    expected:
      rows:
        - ['[{"a":1},{"a":2}]']
  - desc: string input yields ARRAY<STRING> of JSON-formatted elements, nulls included
    sql: SELECT ARRAY_TO_STRING(JSON_QUERY_ARRAY('["p", null, 1]', '$'), '|')
    expected:
      rows:
        - ['"p"|null|1']
  - desc: string input that is not JSON yields NULL
    sql: SELECT JSON_QUERY_ARRAY('*', '$') IS NULL
    expected:
      rows:
        - [true]
