spec: docs/specs/googlesql/functions/json/json_extract_array.md
dialect: googlesql
cases:
  - desc: extract integer array via path expression
    sql: SELECT TO_JSON_STRING(JSON_EXTRACT_ARRAY(JSON '[1,2,3]'))
    expected:
      rows:
        - ['[1,2,3]']
  - desc: string input yields ARRAY<STRING> of JSON-formatted elements, nulls included
    sql: SELECT ARRAY_TO_STRING(JSON_EXTRACT_ARRAY('[1, null, "s"]', '$'), '|')
    expected:
      rows:
        - ['1|null|"s"']
