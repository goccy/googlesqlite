spec: docs/specs/googlesql/functions/json/json_value_array.md
dialect: googlesql
cases:
  - desc: json_value_array basic behaviour
    sql: SELECT TO_JSON_STRING(JSON_VALUE_ARRAY(JSON '["a","b"]'))
    expected:
      rows:
        - ['["a","b"]']
  - desc: a JSON null element becomes a NULL element, the string "null" does not
    sql: SELECT ARRAY_TO_STRING(JSON_VALUE_ARRAY('["a", null, "null"]', '$'), ',', 'NULL'), ARRAY_LENGTH(JSON_VALUE_ARRAY('[null]', '$'))
    expected:
      rows:
        - ["a,NULL,null", 1]
