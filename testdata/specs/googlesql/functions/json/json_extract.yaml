spec: docs/specs/googlesql/functions/json/json_extract.md
dialect: googlesql
cases:
  - desc: extract object subtree
    sql: |
      SELECT JSON_EXTRACT('{"a": 1, "b": 2}', "$.a")
    expected:
      rows:
        - ["1"]
  - desc: string input result is a STRING usable by string functions
    sql: |
      SELECT REGEXP_EXTRACT_ALL(JSON_EXTRACT('{"a": "x1y2"}', '$.a'), r'\d'), UPPER(JSON_EXTRACT('{"a": "q"}', "$.a"))
    expected:
      rows:
        - [['1', '2'], '"Q"']
