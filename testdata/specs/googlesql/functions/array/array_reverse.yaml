spec: docs/specs/googlesql/functions/array/array_reverse.md
dialect: googlesql
cases:
  - desc: reverse three-element array
    sql: SELECT ARRAY_REVERSE([1, 2, 3])
    expected:
      rows:
        - [[3, 2, 1]]
  - desc: null array propagates
    sql: SELECT ARRAY_REVERSE(CAST(NULL AS ARRAY<INT64>))
    expected:
      rows:
        - [null]
