spec: docs/specs/googlesql/functions/array/array_reverse.md
dialect: googlesql
cases:
  - desc: reverse three-element array
    sql: SELECT ARRAY_REVERSE([1, 2, 3])
    expected:
      rows:
        - [[3, 2, 1]]
  - desc: NULL array returns NULL
    sql: SELECT ARRAY_REVERSE(CAST(NULL AS ARRAY<INT64>)) IS NULL, ARRAY_REVERSE(JSON_QUERY_ARRAY(JSON '{}', '$.missing')) IS NULL
    expected:
      rows:
        - [true, true]
