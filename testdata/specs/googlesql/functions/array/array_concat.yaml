spec: docs/specs/googlesql/functions/array/array_concat.md
dialect: googlesql
cases:
  - desc: concat two int arrays
    sql: SELECT ARRAY_CONCAT([1, 2], [3, 4])
    expected:
      rows:
        - [[1, 2, 3, 4]]
  - desc: null argument propagates
    sql: SELECT ARRAY_CONCAT(CAST(NULL AS ARRAY<INT64>), [1, 2])
    expected:
      rows:
        - [null]
