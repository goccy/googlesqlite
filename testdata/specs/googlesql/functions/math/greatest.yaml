spec: docs/specs/googlesql/functions/math/greatest.md
dialect: googlesql
cases:
  - desc: greatest of three
    sql: SELECT GREATEST(1, 5, 3)
    expected:
      rows:
        - [5]
  - desc: BOOL arguments order FALSE before TRUE
    sql: SELECT GREATEST(FALSE, TRUE), LEAST(TRUE, FALSE), FALSE < TRUE
    expected:
      rows:
        - [true, false, true]
