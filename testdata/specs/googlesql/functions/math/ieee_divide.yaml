spec: docs/specs/googlesql/functions/math/ieee_divide.md
dialect: googlesql
cases:
  - desc: division by zero returns +Infinity
    sql: SELECT IS_INF(IEEE_DIVIDE(1.0, 0.0))
    expected:
      rows:
        - [true]
  - desc: regular division
    sql: SELECT IEEE_DIVIDE(10.0, 2.0)
    expected:
      rows:
        - [5.0]
  - desc: division by zero yields infinities and NaN that survive as values
    sql: SELECT IS_INF(IEEE_DIVIDE(o, z)), IEEE_DIVIDE(o, z) > 0, IS_NAN(IEEE_DIVIDE(z, z)) FROM (SELECT 1.0 AS o, 0.0 AS z)
    expected:
      rows:
        - [true, true, true]
