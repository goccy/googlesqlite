spec: docs/specs/googlesql/functions/string/format.md
dialect: googlesql
cases:
  - desc: format basic behaviour
    sql: SELECT FORMAT("%05d", 42)
    expected:
      rows:
        - ['00042']
  - desc: '%t and %T print FLOAT64 with a fractional part'
    sql: SELECT FORMAT('%t %T %t %t', x, x, x * 1e15, x / 3e5) FROM (SELECT 3.0 AS x)
    expected:
      rows:
        - ["3.0 3.0 3e+15 1e-05"]
