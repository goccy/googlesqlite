spec: docs/specs/googlesql/syntax/query/union.md
dialect: googlesql
cases:
  - desc: UNION ALL retains duplicates
    sql: |-
      (SELECT 1 AS x) UNION ALL (SELECT 1)
    expected:
      rows:
        - [1]
        - [1]
  - desc: UNION DISTINCT deduplicates
    sql: |-
      (SELECT 1 AS x UNION ALL SELECT 2) UNION DISTINCT (SELECT 2 UNION ALL SELECT 3)
    expected:
      rows:
        - [1]
        - [2]
        - [3]
  - desc: a branch that projects one column twice does not capture later branches' columns
    sql: |-
      SELECT x, x AS y FROM (SELECT 's1' AS x)
      UNION ALL SELECT p AS x, q AS y FROM (SELECT 'r' AS p, 'k' AS q)
      UNION ALL SELECT 'u', 'v'
    expected:
      rows:
        - ['s1', 's1']
        - ['r', 'k']
        - ['u', 'v']
