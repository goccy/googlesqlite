spec: docs/specs/googlesql/syntax/query/window_clause.md
dialect: googlesql
cases:
  - desc: named window via WINDOW clause
    sql: |-
      SELECT x, SUM(x) OVER w AS running
      FROM UNNEST([1, 2, 3]) AS x
      WINDOW w AS (ORDER BY x ROWS UNBOUNDED PRECEDING)
      ORDER BY x
    expected:
      rows:
        - [1, 1]
        - [2, 3]
        - [3, 6]
  - desc: RANGE offset frame with PARTITION BY
    sql: |-
      SELECT k, x, COUNT(*) OVER (PARTITION BY k ORDER BY x RANGE BETWEEN 1 PRECEDING AND 1 FOLLOWING) AS n
      FROM UNNEST([STRUCT('a' AS k, 1 AS x), ('a', 2), ('a', 4), ('b', 1)])
      ORDER BY k, x
    expected:
      rows:
        - ['a', 1, 2]
        - ['a', 2, 2]
        - ['a', 4, 1]
        - ['b', 1, 1]
