spec: docs/specs/googlesql/syntax/query/group_by.md
dialect: googlesql
# Covers GROUP BY with the four equality-on-composite-value cases the
# downstream fork patched: scalar key, struct-field key, NULL-in-key
# bucketing, and ARRAY-in-row column.
cases:
  - desc: scalar GROUP BY with COUNT
    sql: |-
      SELECT k, COUNT(*) AS n
      FROM UNNEST([STRUCT('a' AS k), STRUCT('a'), STRUCT('b')])
      GROUP BY k
      ORDER BY k
    expected:
      rows:
        - ['a', 2]
        - ['b', 1]
  - desc: GROUP BY on individual STRUCT fields
    sql: |-
      SELECT s.x AS gx, s.y AS gy, COUNT(*) AS n
      FROM UNNEST([STRUCT(1 AS x, 'a' AS y), STRUCT(1, 'a'), STRUCT(2, 'b')]) AS s
      GROUP BY s.x, s.y
      ORDER BY gx
    expected:
      rows:
        - [1, 'a', 2]
        - [2, 'b', 1]
  - desc: NULL becomes its own GROUP BY bucket
    sql: |-
      SELECT k, COUNT(*) AS n
      FROM UNNEST([
        STRUCT(1 AS k),
        STRUCT(CAST(NULL AS INT64)),
        STRUCT(1),
        STRUCT(CAST(NULL AS INT64))
      ])
      GROUP BY k
      ORDER BY k NULLS LAST
    expected:
      rows:
        - [1, 2]
        - [null, 2]
  - desc: GROUP BY a scalar column that carries an ARRAY field in the row
    sql: |-
      SELECT k, COUNT(*) AS n
      FROM UNNEST([
        STRUCT('a' AS k, [1, 2] AS arr),
        STRUCT('a', [1, 2]),
        STRUCT('b', [3, 4])
      ])
      GROUP BY k
      ORDER BY k
    expected:
      rows:
        - ['a', 2]
        - ['b', 1]
  # Upstream Examples (query-syntax.md#group_by_all).
  - desc: GROUP BY ALL infers keys from non-aggregate SELECT items
    sql: |-
      WITH PlayerStats AS (
        SELECT 'Adams' as LastName, 'Noam' as FirstName, 3 as PointsScored UNION ALL
        SELECT 'Buchanan', 'Jie', 0 UNION ALL
        SELECT 'Coolidge', 'Kiran', 1 UNION ALL
        SELECT 'Adams', 'Noam', 4 UNION ALL
        SELECT 'Buchanan', 'Jie', 13)
      SELECT
        SUM(PointsScored) AS total_points,
        FirstName AS first_name,
        LastName AS last_name
      FROM PlayerStats
      GROUP BY ALL
    expected:
      unordered: true
      rows:
        - [7, 'Noam', 'Adams']
        - [13, 'Jie', 'Buchanan']
        - [1, 'Kiran', 'Coolidge']
  - desc: GROUP BY ALL excludes window functions from the inferred keys
    sql: |-
      WITH PlayerStats AS (
        SELECT 'Adams' as LastName, 'Noam' as FirstName, 3 as PointsScored UNION ALL
        SELECT 'Buchanan', 'Jie', 0 UNION ALL
        SELECT 'Coolidge', 'Kiran', 1 UNION ALL
        SELECT 'Adams', 'Noam', 4 UNION ALL
        SELECT 'Buchanan', 'Jie', 13)
      SELECT
        COUNT(*) OVER () AS total_people,
        FirstName AS first_name,
        LastName AS last_name
      FROM PlayerStats
      GROUP BY ALL
    expected:
      unordered: true
      rows:
        - [3, 'Noam', 'Adams']
        - [3, 'Jie', 'Buchanan']
        - [3, 'Kiran', 'Coolidge']
  - desc: GROUP BY ALL groups only by prefix paths when items overlap
    sql: |-
      WITH Values AS (
        SELECT 1 AS x, 2 AS y
        UNION ALL SELECT 1 AS x, 4 AS y
        UNION ALL SELECT 2 AS x, 5 AS y
      )
      SELECT
        Values.x AS x_coordinate,
        Values.y AS y_coordinate,
        [Values.x, Values.y] AS coordinates
      FROM Values
      GROUP BY ALL
    expected:
      unordered: true
      rows:
        - [1, 4, [1, 4]]
        - [1, 2, [1, 2]]
        - [2, 5, [2, 5]]
  - desc: GROUP BY ALL with no inferred keys aggregates everything into one row
    sql: |-
      SELECT COUNT(*) AS num_rows
      FROM UNNEST([])
      GROUP BY ALL
    expected:
      rows:
        - [0]
