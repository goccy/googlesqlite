spec: docs/specs/bigquery/functions/json/json_keys.md
dialect: bigquery
cases:
  - desc: top-level object keys
    sql: SELECT TO_JSON_STRING(JSON_KEYS(JSON '{"a":1,"b":2}'))
    expected:
      rows:
        - ['["a","b"]']
  - desc: nested keys flattened via dot notation
    sql: SELECT TO_JSON_STRING(JSON_KEYS(JSON '{"a":{"b":{"c":1}}}'))
    expected:
      rows:
        - ['["a","a.b","a.b.c"]']
  - desc: max_depth caps recursion
    sql: SELECT TO_JSON_STRING(JSON_KEYS(JSON '{"a":{"b":{"c":1}}}', 2))
    expected:
      rows:
        - ['["a","a.b"]']
  - desc: strict mode skips array-nested keys
    sql: SELECT TO_JSON_STRING(JSON_KEYS(JSON '{"a":[{"b":1}]}'))
    expected:
      rows:
        - ['["a"]']
  - desc: only keys containing a dot or a double quote are escaped, and keys round-trip through subscript
    sql: |
      SELECT TO_JSON_STRING(JSON_KEYS(j, 1)), TO_JSON_STRING(ARRAY(SELECT j[k] FROM UNNEST(JSON_KEYS(j, 1)) AS k WHERE j[k] IS NOT NULL ORDER BY k))
      FROM (SELECT JSON '{"k:v": 2, "a b": 1, "a.b": 3}' AS j)
    expected:
      rows:
        - ['["\"a.b\"","a b","k:v"]', "[1,2]"]
